# Render Blueprint — the actual deploy target (Azure Container Apps and
# Vercel were both considered and dropped; see docs/PROGRESS.md). Reuses
# the same root Dockerfile unchanged — Render runs it as a real container,
# so none of the serverless rework Vercel would have required was needed.
services:
  - type: web
    name: higiexpo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: higiexpo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: higiexpo-db
    databaseName: higiexpo
    user: higiexpo
    plan: free
